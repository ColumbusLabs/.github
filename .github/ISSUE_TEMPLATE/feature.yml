name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find an equivalent request.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What user or developer problem would this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the outcome you would like, including alternatives you considered.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add examples, mockups, or related links that clarify the request.
