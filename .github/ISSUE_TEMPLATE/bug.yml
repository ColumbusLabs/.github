name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report does not contain credentials or sensitive data.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that demonstrates the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include relevant app or package version, operating system, runtime, and hardware.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add logs, screenshots, or other context after removing sensitive information.
